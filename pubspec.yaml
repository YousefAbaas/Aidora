environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  intl: ^0.19.0
  mobile_scanner: ^6.0.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
