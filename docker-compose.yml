services:
  postgres:
    image: postgres:16
    container_name: aidora-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the root .env file}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in the root .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    volumes:
      - aidora-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - aidora-network

  django:
    build: ./backend
    image: aidora-django
    container_name: aidora-django
    env_file:
      - .env
    environment:
      DB_HOST: aidora-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in the root .env file}
      DB_USER: ${DB_USER:?Set DB_USER in the root .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@aidora-postgres:5432/${DB_NAME}"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - aidora-network

volumes:
  aidora-postgres-data:
    external: true
    name: 0c0344486df5f235a9c469431a43cd421271b3309a2a2a643faa242b87a73427

networks:
  aidora-network:
    external: true
    name: aidora-network