name: Synthetic community policy-check tests

on:
  push:
    branches:
      - mozilla-2027-prep
    paths:
      - "prototypes/community-policy-check/**"
      - ".github/workflows/community-policy-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "prototypes/community-policy-check/**"
      - ".github/workflows/community-policy-check.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library unit tests
        run: python -m unittest discover -s prototypes/community-policy-check -p "test_*.py" -v
