name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aidora_ci
          POSTGRES_USER: aidora_ci
          POSTGRES_PASSWORD: aidora_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aidora_ci -d aidora_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: ci-test-secret-key
      DB_NAME: aidora_ci
      DB_USER: aidora_ci
      DB_PASSWORD: aidora_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test
